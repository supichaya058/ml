            displaylogo:false,

            modeBarButtonsToRemove:[

                "toImage",
                "zoom2d",
                "pan2d",
                "select2d",
                "lasso2d",
                "autoScale2d",
                "resetScale2d",
                "hoverClosestCartesian",
                "hoverCompareCartesian",
                "toggleSpikelines"

            ]

        }

    );


    /* -----------------------------------------------------
       Update center label
    ----------------------------------------------------- */

    const centerNumber =
        document.querySelector(
            ".research-center-number"
        );

    const centerText =
        document.querySelector(
            ".research-center-text"
        );


    if(centerNumber){

        centerNumber.textContent =
            DATASET_INFO.researchSubjects;

    }


    if(centerText){

        centerText.textContent =
            "Research Areas";

    }


    /* -----------------------------------------------------
       Click → Pull
    ----------------------------------------------------- */

    pie.on(
        "plotly_click",
        function(event){

            if(
                !event ||
                !event.points ||
                !event.points.length
            ){

                return;

            }


            const index =
                event.points[0].pointNumber;


            const currentPull =
                pie.data[0].pull || [];


            const nextPull =
                currentPull.map(
                    (value,i)=>
                        i===index
                            ? (
                                Number(value)>0
                                    ? 0
                                    : .10
                              )
                            : 0
                );


            Plotly.restyle(

                pie,

                {
                    pull:[
                        nextPull
                    ]
                },

                [0]

            );

        }
    );


    /* -----------------------------------------------------
       Hover
    ----------------------------------------------------- */

    pie.on(
        "plotly_hover",
        function(event){

            if(
                !event ||
                !event.points ||
                !event.points.length
            ){

                return;

            }


            const index =
                event.points[0].pointNumber;


            const hoverPull =
                RESEARCH_AREAS.map(
                    (item,i)=>
                        i===index
                            ? .035
                            : 0
                );


            const currentPull =
                pie.data[0].pull || [];


            const hasActive =
                currentPull.some(
                    value =>
                        Number(value)>=.09
                );


            if(!hasActive){

                Plotly.restyle(

                    pie,

                    {
                        pull:[
                            hoverPull
                        ]
                    },

                    [0]

                );

            }

        }
    );


    pie.on(
        "plotly_unhover",
        function(){

            const currentPull =
                pie.data[0].pull || [];


            const hasActive =
                currentPull.some(
                    value =>
                        Number(value)>=.09
                );


            if(!hasActive){

                Plotly.restyle(

                    pie,

                    {
                        pull:[
                            RESEARCH_AREAS.map(
                                ()=>0
                            )
                        ]
                    },

                    [0]

                );

            }

        }
    );


    window.addEventListener(
        "resize",
        function(){

            Plotly.Plots.resize(
                pie
            );

        }
    );

})();

(function(){

    const field =

            "coField"
        );

    const svg =
        document.getElementById(
            "coSvg"
        );


    const keywordLookup =
        Object.fromEntries(
            TOP_KEYWORDS.map(
                item=>[
                    item.keyword,
                    item.count
                ]
            )
        );


    const flowers = [

        {
            keyword:"Deep Learning",
            count:284,
            x:13,
            y:39,
            icon:"🌸"
        },

        {
            keyword:"Machine Learning",
            count:204,
            x:25,
            y:30,
            icon:"🌷"
        },

        {
            keyword:"Federated Learning",
            count:59,
            x:21,
            y:56,
            icon:"🌺"
        },

        {
            keyword:"Computer Vision",
            count:57,
            x:65,
            y:31,
            icon:"🌻"
        },

        {
            keyword:"Large Language Models",
            count:56,
            x:83,
            y:35,
            icon:"🪻"
        },

        {
            keyword:"FPGA",
            count:53,
            x:67,
            y:56,
            icon:"🪷"
        },

        {
            keyword:"Virtual Reality",
            count:53,
            x:83,
            y:56,
            icon:"🏵️"
        },

        {
            keyword:"Generative AI",
            count:52,
            x:36,
            y:79,
            icon:"🌹"
        },

        {
            keyword:"Transformer",
            count:48,
            x:49,
            y:86,
            icon:"💮"
        }

    ];


    const center = {

        keyword:"Artificial Intelligence",

        count:
            keywordLookup[
                "Artificial Intelligence"
            ] || 247,

        x:50,
        y:48

    };


    const connections = [

        ["Artificial Intelligence","Machine Learning",3],

        ["Artificial Intelligence","Deep Learning",3],

        ["Deep Learning","Machine Learning",3],

        ["Computer Vision","Deep Learning",2],

        ["Deep Learning","Transformer",2],

        ["Artificial Intelligence","Computer Vision",2],

        ["Artificial Intelligence","Generative AI",2],

        ["Artificial Intelligence","Large Language Models",2],

        ["Artificial Intelligence","Transformer",2],

        ["Artificial Intelligence","Federated Learning",1],

        ["Artificial Intelligence","Virtual Reality",1],

        ["Machine Learning","FPGA",1],

        ["Generative AI","Large Language Models",1]

    ];


    const maxCount =
        Math.max(
            ...flowers.map(
                item=>item.count
            ),
            center.count
        );


    /* =====================================================
       CREATE FLOWERS
    ===================================================== */

    flowers.forEach(
        item=>{

            const flower =
                document.createElement(
                    "div"
                );


            flower.className =
                "co-flower";


            flower.style.left =
                item.x+"%";


            flower.style.top =
                item.y+"%";


            const ratio =
                Math.sqrt(
                    item.count /
                    maxCount
                );


            const size =
                28 +
                ratio*38;


            const icon =
                document.createElement(
                    "div"
                );


            icon.className =
                "icon";


            icon.style.fontSize =
                size+"px";


            icon.textContent =
                item.icon;


            const name =
                document.createElement(
                    "div"
                );


            name.className =
                "name";


            name.textContent =
                item.keyword;


            const count =
                document.createElement(
                    "div"
                );


            count.className =
                "count";


            count.textContent =
                item.count.toLocaleString();


            flower.appendChild(icon);

            flower.appendChild(name);

            flower.appendChild(count);


            flower.title =
                item.keyword+
                "\nFrequency: "+
                item.count;


            flower.addEventListener(
                "click",
                function(event){

                    event.stopPropagation();


                    field
                        .querySelectorAll(
                            ".co-flower"
                        )
                        .forEach(
                            other=>
                                other.classList.remove(
                                    "selected"
                                )
                        );


                    void flower.offsetWidth;


                    flower.classList.add(
                        "selected"
                    );

                }
            );


            field.appendChild(
                flower
            );

        }
    );


    /* =====================================================
       CENTER LABEL
    ===================================================== */

    const centerName =
        field.querySelector(
            ".co-center .name"
        );


    if(centerName){

        centerName.textContent =
            "Artificial Intelligence · 247";

    }


    /* =====================================================
       CLEAR SELECTION
    ===================================================== */

    field.addEventListener(
        "click",
        function(){

            field
                .querySelectorAll(
                    ".co-flower"
                )
                .forEach(
                    flower=>
                        flower.classList.remove(
                            "selected"
                        )
                );

        }
    );


    function getFlower(keyword){

        if(
            keyword ===
            "Artificial Intelligence"
        ){

            return center;

        }


        return flowers.find(
            item =>
                item.keyword ===
                keyword
        );

    }


    /* =====================================================
       DRAW NETWORK
    ===================================================== */

    function drawNetwork(){

        const rect =
            field.getBoundingClientRect();


        const width =
            rect.width;


        const height =
            rect.height;


        svg.setAttribute(
            "viewBox",
            `0 0 ${width} ${height}`
        );


        svg.innerHTML="";


        connections.forEach(
            connection=>{

                const from =
                    getFlower(
                        connection[0]
                    );


                const to =
                    getFlower(
                        connection[1]
                    );


                if(
                    !from ||
                    !to
                ){

                    return;

                }


                const strength =
                    connection[2];


                const x1 =
                    from.x/100*width;


                const y1 =
                    from.y/100*height;


                const x2 =
                    to.x/100*width;


                const y2 =
                    to.y/100*height;


                const midX =
                    (x1+x2)/2;


                const midY =
                    (y1+y2)/2;


                const dx =
                    x2-x1;


                const dy =
                    y2-y1;


                const distance =
                    Math.sqrt(
                        dx*dx+
                        dy*dy
                    );


                const curve =
                    Math.min(
                        50,
                        distance*.20
                    );


                let controlX =
                    midX;


                let controlY =
                    midY;


                if(distance>0){

                    controlX =
                        midX -
                        dy/distance*
                        curve;


                    controlY =
                        midY +
                        dx/distance*
                        curve;

                }


                const path =
                    document.createElementNS(
                        "http://www.w3.org/2000/svg",
                        "path"
                    );


                path.setAttribute(
                    "d",
                    `
                    M ${x1} ${y1}
                    Q ${controlX} ${controlY}
                      ${x2} ${y2}
                    `
                );


                if(strength===3){

                    path.setAttribute(
                        "class",
                        "co-line strong"
                    );

                }

                else if(strength===2){

                    path.setAttribute(
                        "class",
                        "co-line medium"
                    );

                }

                else{

                    path.setAttribute(
                        "class",
                        "co-line"
                    );

                }


                svg.appendChild(
                    path
                );

            }
        );

    }


    setTimeout(
        drawNetwork,
        200
    );


    window.addEventListener(
        "resize",
        drawNetwork
    );

})();

       This allows the dashboard to use data above.
    ===================================================== */

    field
        .querySelectorAll(
            ".feature-flower"
        )
        .forEach(
            element=>
                element.remove()
        );


    /* =====================================================
       CREATE FEATURE FLOWERS
    ===================================================== */

    featureData.forEach(
        item=>{

            const flower =
                document.createElement(
                    "div"
                );


            flower.className =
                "feature-flower";


            flower.style.left =
                item.x+"%";


            flower.style.top =
                item.y+"%";


            const ratio =
                Math.sqrt(
                    item.count/
                    maxCount
                );


            const size =
                28+
                ratio*28;


            const emoji =
                document.createElement(
                    "div"
                );


            emoji.className =
                "emoji";


            emoji.style.fontSize =
                size+"px";


            emoji.textContent =
                item.icon;


            const label =
                document.createElement(
                    "div"
                );


            label.className =
                "label";


            label.textContent =
                item.keyword;


            const count =
                document.createElement(
                    "div"
                );


            count.className =
                "count";


            count.textContent =
                item.count.toLocaleString();


            flower.appendChild(
                emoji
            );


            flower.appendChild(
                label
            );


            flower.appendChild(
                count
            );


            flower.title =
                item.keyword+
                "\nFrequency: "+
                item.count;


            flower.dataset.group =
                item.group;


            flower.addEventListener(
                "click",
                function(event){

                    event.stopPropagation();


                    field
                        .querySelectorAll(
                            ".feature-flower"
                        )
                        .forEach(
                            other =>
                                other.classList.remove(
                                    "selected"
                                )
                        );


                    void flower.offsetWidth;


                    flower.classList.add(
                        "selected"
                    );

                }
            );


            field.appendChild(
                flower
            );

        }
    );


    /* =====================================================
       CLEAR SELECTION
    ===================================================== */

    field.addEventListener(
        "click",
        function(){

            field
                .querySelectorAll(
                    ".feature-flower"
                )
                .forEach(
                    flower =>
                        flower.classList.remove(
                            "selected"
                        )
                );

        }
    );


    /* =====================================================
       FEATURE VECTOR CONNECTIONS
    ===================================================== */

    const lines = [

        {

            group:"ai",

            points:[

                [15,38],
                [29,35],
                [42,39],
                [22,53],
                [36,55]

            ]

        },

        {

            group:"vision",

            points:[

                [61,36],
                [75,35],
                [69,52],
                [83,51],
                [80,64]

            ]

        }

    ];


    /* =====================================================
       DRAW SVG CONNECTIONS
    ===================================================== */

    function draw(){

        const rect =
            field.getBoundingClientRect();


        const width =
            rect.width;


        const height =
            rect.height;


        svg.setAttribute(
            "viewBox",
            `0 0 ${width} ${height}`
        );


        svg.innerHTML="";


        lines.forEach(
            group=>{

                for(
                    let i=0;
                    i<group.points.length-1;
                    i++
                ){

                    const a =
                        group.points[i];


                    const b =
                        group.points[i+1];


                    const line =
                        document.createElementNS(
                            "http://www.w3.org/2000/svg",
                            "line"
                        );


                    line.setAttribute(
                        "x1",
                        a[0]/100*width
                    );


                    line.setAttribute(
                        "y1",
                        a[1]/100*height
                    );


                    line.setAttribute(
                        "x2",
                        b[0]/100*width
                    );


                    line.setAttribute(
                        "y2",
                        b[1]/100*height
                    );


                    line.setAttribute(
                        "class",
                        "feature-line "+
                        group.group
                    );


                    svg.appendChild(
                        line
                    );

                }

            }
        );

    }


    setTimeout(
        draw,
        200
    );


    window.addEventListener(
        "resize",
        draw
    );

})();

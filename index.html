<script>

/* =========================================================
   DATA
=========================================================

   เอาข้อมูล CSV จริงของคุณมาใส่ตรงนี้

   ตัวอย่าง:

   const CSV_DATA = `
   ID,Author_Keywords_normalized
   1,"artificial intelligence; machine learning"
   2,"machine learning; deep learning"
   3,"artificial intelligence; deep learning"
   `;

========================================================= */

const CSV_DATA = `PASTE_YOUR_CSV_HERE`;


/* =========================================================
   CSV PARSER
========================================================= */

function parseCSV(text){

    const rows = [];

    let row = [];

    let value = "";

    let insideQuotes = false;


    for(let i=0;i<text.length;i++){

        const char = text[i];

        const next = text[i+1];


        if(char === '"' && next === '"' && insideQuotes){

            value += '"';

            i++;

            continue;

        }


        if(char === '"'){

            insideQuotes = !insideQuotes;

            continue;

        }


        if(char === "," && !insideQuotes){

            row.push(value);

            value="";

            continue;

        }


        if(
            (char === "\n" || char === "\r")
            &&
            !insideQuotes
        ){

            if(char === "\r" && next === "\n"){

                i++;

            }


            row.push(value);

            value="";


            if(row.some(v => v.trim() !== "")){

                rows.push(row);

            }


            row=[];

            continue;

        }


        value += char;

    }


    if(value.length || row.length){

        row.push(value);

        rows.push(row);

    }


    if(rows.length === 0){

        return [];

    }


    const headers = rows[0].map(
        h => h.trim()
    );


    return rows.slice(1).map(row => {

        const obj={};

        headers.forEach(
            (header,index)=>{

                obj[header] =
                    row[index] ?? "";

            }
        );

        return obj;

    });

}


/* =========================================================
   CLEAN KEYWORD
========================================================= */

function cleanKeyword(value){

    return String(value ?? "")
        .trim()
        .toLowerCase()
        .replace(/\s+/g," ");

}


/* =========================================================
   FIND KEYWORD COLUMN
========================================================= */

function findKeywordColumn(rows){

    const candidates=[

        "Author_Keywords_normalized",

        "Author Keywords",

        "Author_Keywords_clean"

    ];


    for(const column of candidates){

        if(
            rows.length > 0 &&
            Object.prototype.hasOwnProperty.call(
                rows[0],
                column
            )
        ){

            return column;

        }

    }


    return null;

}


/* =========================================================
   COLORS
========================================================= */

const FLOWER_COLORS=[

    "#F59E9E",
    "#F6C85F",
    "#8FD3A8",
    "#8EC5E8",
    "#C5A6E8",
    "#F2A7D0",
    "#A8D8C0",
    "#F4B183",
    "#9FA8DA",
    "#B8D8BA",
    "#E7B7A3",
    "#A7C7E7"

];


/* =========================================================
   RANDOM
========================================================= */

function seededRandom(seed){

    let x = seed >>> 0;


    return function(){

        x =
            (1664525*x + 1013904223)
            >>> 0;

        return x / 4294967296;

    };

}


/* =========================================================
   COMMUNITY DETECTION
=========================================================

   Browser version of the grouping process.
========================================================= */

function detectCommunities(nodes,edges){

    const adjacency = new Map();


    nodes.forEach(node=>{

        adjacency.set(
            node,
            new Map()
        );

    });


    edges.forEach(edge=>{

        adjacency
            .get(edge.a)
            .set(edge.b,edge.weight);

        adjacency
            .get(edge.b)
            .set(edge.a,edge.weight);

    });


    const labels = new Map();


    nodes.forEach(node=>{

        labels.set(node,node);

    });


    const random =
        seededRandom(42);


    for(let iteration=0;
        iteration<50;
        iteration++){

        let changed=0;


        const order =
            [...nodes].sort(
                ()=>random()-.5
            );


        order.forEach(node=>{

            const scores=new Map();


            for(
                const [neighbor,weight]
                of adjacency.get(node)
            ){

                const label =
                    labels.get(neighbor);


                scores.set(
                    label,
                    (scores.get(label)||0)
                    +weight
                );

            }


            if(scores.size===0){

                return;

            }


            let bestLabel =
                labels.get(node);

            let bestScore=-Infinity;


            scores.forEach(
                (score,label)=>{

                    if(score>bestScore){

                        bestScore=score;

                        bestLabel=label;

                    }

                }
            );


            if(
                bestLabel !==
                labels.get(node)
            ){

                labels.set(
                    node,
                    bestLabel
                );

                changed++;

            }

        });


        if(changed===0){

            break;

        }

    }


    const groups=new Map();


    nodes.forEach(node=>{

        const label =
            labels.get(node);


        if(!groups.has(label)){

            groups.set(label,[]);

        }


        groups
            .get(label)
            .push(node);

    });


    return [...groups.values()]

        .filter(
            group => group.length>=2
        )

        .sort(
            (a,b)=>b.length-a.length
        );

}


/* =========================================================
   GROUP POSITIONS
========================================================= */

function createGroupCenters(
    numberOfGroups,
    distanceX,
    distanceY
){

    const centers={};


    if(numberOfGroups===0){

        return centers;

    }


    let columns;


    if(numberOfGroups<=3){

        columns=numberOfGroups;

    }
    else if(numberOfGroups<=6){

        columns=3;

    }
    else{

        columns=4;

    }


    const rows =
        Math.ceil(
            numberOfGroups / columns
        );


    const startX =
        -((columns-1)*distanceX/2);


    const startY =
        ((rows-1)*distanceY/2);


    for(
        let i=0;
        i<numberOfGroups;
        i++
    ){

        const row =
            Math.floor(i/columns);


        const column =
            i%columns;


        centers[i]=[

            startX +
            column*distanceX,

            startY -
            row*distanceY

        ];

    }


    return centers;

}


/* =========================================================
   LOCAL LAYOUT
========================================================= */

function localLayout(
    nodes,
    edges,
    centerX,
    centerY,
    scale
){

    const positions=new Map();


    if(nodes.length===1){

        positions.set(
            nodes[0],
            [centerX,centerY]
        );

        return positions;

    }


    const random =
        seededRandom(
            nodes.length*123
        );


    const position=new Map();


    nodes.forEach(
        (node,index)=>{

            const angle =
                index/nodes.length *
                Math.PI*2;


            position.set(
                node,
                [

                    Math.cos(angle) *
                    (1+random()*.5),

                    Math.sin(angle) *
                    (1+random()*.5)

                ]
            );

        }
    );


    const localEdges =
        edges.filter(
            edge =>
                nodes.includes(edge.a)
                &&
                nodes.includes(edge.b)
        );


    const k =
        Math.sqrt(
            4/nodes.length
        );


    for(let iteration=0;
        iteration<160;
        iteration++){

        const displacement=new Map();


        nodes.forEach(node=>{

            displacement.set(
                node,
                [0,0]
            );

        });


        /* REPULSION */

        for(
            let i=0;
            i<nodes.length;
            i++
        ){

            for(
                let j=i+1;
                j<nodes.length;
                j++
            ){

                const a=nodes[i];

                const b=nodes[j];


                let dx =
                    position.get(a)[0]
                    -
                    position.get(b)[0];


                let dy =
                    position.get(a)[1]
                    -
                    position.get(b)[1];


                let distance =
                    Math.sqrt(
                        dx*dx+dy*dy
                    );


                if(distance===0){

                    distance=.01;

                }


                const force =
                    (k*k)/distance;


                dx/=distance;

                dy/=distance;


                displacement.get(a)[0]
                    +=dx*force;


                displacement.get(a)[1]
                    +=dy*force;


                displacement.get(b)[0]
                    -=dx*force;


                displacement.get(b)[1]
                    -=dy*force;

            }

        }


        /* ATTRACTION */

        localEdges.forEach(edge=>{

            const a=edge.a;

            const b=edge.b;


            let dx =
                position.get(a)[0]
                -
                position.get(b)[0];


            let dy =
                position.get(a)[1]
                -
                position.get(b)[1];


            let distance =
                Math.sqrt(
                    dx*dx+dy*dy
                );


            if(distance===0){

                distance=.01;

            }


            const force =
                (distance*distance) /
                (k*Math.max(1,edge.weight));


            dx/=distance;

            dy/=distance;


            displacement.get(a)[0]
                -=dx*force;


            displacement.get(a)[1]
                -=dy*force;


            displacement.get(b)[0]
                +=dx*force;


            displacement.get(b)[1]
                +=dy*force;

        });


        const temperature =
            .15 *
            (1-iteration/160);


        nodes.forEach(node=>{

            const d =
                displacement.get(node);


            const length =
                Math.sqrt(
                    d[0]*d[0]+
                    d[1]*d[1]
                ) || 1;


            position.get(node)[0]
                +=
                (d[0]/length)
                *
                Math.min(
                    length,
                    temperature
                );


            position.get(node)[1]
                +=
                (d[1]/length)
                *
                Math.min(
                    length,
                    temperature
                );

        });

    }


    nodes.forEach(node=>{

        const p =
            position.get(node);


        positions.set(
            node,
            [

                centerX+p[0]*scale,

                centerY+p[1]*scale

            ]
        );

    });


    return positions;

}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHTML(text){

    return String(text)

        .replaceAll("&","&amp;")

        .replaceAll("<","&lt;")

        .replaceAll(">","&gt;")

        .replaceAll('"',"&quot;")

        .replaceAll("'","&#039;");

}


/* =========================================================
   MAIN
========================================================= */

function generateVisualization(){

    if(
        !CSV_DATA ||
        CSV_DATA ===
        "PASTE_YOUR_CSV_HERE"
    ){

        document.getElementById(
            "status"
        ).innerHTML=

            "⚠️ กรุณานำข้อมูล CSV จริงมาใส่ในตัวแปร CSV_DATA";

        return;

    }


    const rows =
        parseCSV(CSV_DATA);


    if(rows.length===0){

        throw new Error(
            "CSV ไม่มีข้อมูล"
        );

    }


    const keywordColumn =
        findKeywordColumn(rows);


    if(!keywordColumn){

        document.getElementById(
            "status"
        ).innerHTML=

            "❌ ไม่พบ Keyword column";

        return;

    }


    const paperKeywords=[];


    const frequency=new Map();


    rows.forEach(row=>{

        const keywords =
            String(
                row[keywordColumn] ?? ""
            )
            .split(/[;,]/);


        const cleaned=[];


        keywords.forEach(keyword=>{

            keyword =
                cleanKeyword(keyword);


            if(keyword.length<2){

                return;

            }


            if(
                !cleaned.includes(keyword)
            ){

                cleaned.push(keyword);


                frequency.set(
                    keyword,
                    (frequency.get(keyword)||0)
                    +1
                );

            }

        });


        paperKeywords.push(
            cleaned
        );

    });


    /* SETTINGS */

    const TOP_N =
        Number(
            document.getElementById(
                "topN"
            ).value
        );


    const MIN_EDGE =
        Number(
            document.getElementById(
                "minEdge"
            ).value
        );


    const MAX_NODES =
        Number(
            document.getElementById(
                "maxCluster"
            ).value
        );


    const GROUP_X =
        Number(
            document.getElementById(
                "groupX"
            ).value
        );


    const GROUP_Y =
        Number(
            document.getElementById(
                "groupY"
            ).value
        );


    /* TOP KEYWORDS */

    const topKeywords =
        [...frequency.entries()]

        .sort(
            (a,b)=>b[1]-a[1]
        )

        .slice(
            0,
            TOP_N
        );


    const topSet =
        new Set(
            topKeywords.map(
                x=>x[0]
            )
        );


    const topFrequency =
        new Map(topKeywords);


    /* CO-OCCURRENCE */

    const pairCounts=new Map();


    paperKeywords.forEach(keywords=>{

        const selected =
            [...new Set(
                keywords.filter(
                    keyword =>
                        topSet.has(keyword)
                )
            )]
            .sort();


        for(
            let i=0;
            i<selected.length;
            i++
        ){

            for(
                let j=i+1;
                j<selected.length;
                j++
            ){

                const key =
                    selected[i]
                    +
                    "\u0001"
                    +
                    selected[j];


                pairCounts.set(
                    key,
                    (pairCounts.get(key)||0)
                    +1
                );

            }

        }

    });


    /* EDGES */

    const edges=[];


    pairCounts.forEach(
        (weight,key)=>{

            if(weight>=MIN_EDGE){

                const [
                    a,
                    b
                ] =
                    key.split(
                        "\u0001"
                    );


                edges.push({

                    a:a,

                    b:b,

                    weight:weight

                });

            }

        }
    );


    /* NODES */

    const connected=new Set();


    edges.forEach(edge=>{

        connected.add(edge.a);

        connected.add(edge.b);

    });


    let nodes =
        [...topSet]
        .filter(
            node =>
                connected.has(node)
        );


    /* GROUP */

    let communities =
        detectCommunities(
            nodes,
            edges
        );


    const nodeCluster=new Map();


    communities.forEach(
        (community,groupID)=>{

            community
                .sort(
                    (a,b)=>
                        topFrequency.get(b)
                        -
                        topFrequency.get(a)
                )

                .slice(
                    0,
                    MAX_NODES
                )

                .forEach(node=>{

                    nodeCluster.set(
                        node,
                        groupID
                    );

                });

        }
    );


    nodes =
        [...nodeCluster.keys()];


    const selectedSet =
        new Set(nodes);


    const visibleEdges =
        edges.filter(
            edge =>
                selectedSet.has(edge.a)
                &&
                selectedSet.has(edge.b)
        );


    /* GROUP CENTERS */

    const centers =
        createGroupCenters(
            communities.length,
            GROUP_X,
            GROUP_Y
        );


    /* POSITIONS */

    const positions=new Map();


    communities.forEach(
        (community,groupID)=>{

            const groupNodes =
                community.filter(
                    node =>
                        selectedSet.has(node)
                );


            if(groupNodes.length===0){

                return;

            }


            const [
                centerX,
                centerY
            ] =
                centers[groupID];


            const scale =
                1.35 +
                Math.sqrt(
                    groupNodes.length
                )*.035;


            const localPositions =
                localLayout(
                    groupNodes,
                    visibleEdges,
                    centerX,
                    centerY,
                    scale
                );


            localPositions.forEach(
                (position,node)=>{

                    positions.set(
                        node,
                        position
                    );

                }
            );

        }
    );


    /* =====================================================
       EDGE TRACES
    ===================================================== */

    const internalX=[];

    const internalY=[];

    const crossX=[];

    const crossY=[];


    visibleEdges.forEach(edge=>{

        const [
            x0,
            y0
        ] =
            positions.get(
                edge.a
            );


        const [
            x1,
            y1
        ] =
            positions.get(
                edge.b
            );


        const sameGroup =
            nodeCluster.get(
                edge.a
            )
            ===
            nodeCluster.get(
                edge.b
            );


        if(sameGroup){

            internalX.push(
                x0,
                x1,
                null
            );

            internalY.push(
                y0,
                y1,
                null
            );

        }
        else{

            crossX.push(
                x0,
                x1,
                null
            );

            crossY.push(
                y0,
                y1,
                null
            );

        }

    });


    const crossTrace={

        x:crossX,

        y:crossY,

        mode:"lines",

        line:{

            width:.7,

            color:
                "rgba(80,100,80,.10)"

        },

        hoverinfo:"none",

        showlegend:false

    };


    const internalTrace={

        x:internalX,

        y:internalY,

        mode:"lines",

        line:{

            width:1.6,

            color:
                "rgba(65,100,65,.40)"

        },

        hoverinfo:"none",

        showlegend:false

    };


    /* =====================================================
       KEYWORDS
    ===================================================== */

    const nodeX=[];

    const nodeY=[];

    const nodeSize=[];

    const nodeColor=[];

    const nodeText=[];

    const nodeHover=[];


    nodes.forEach(node=>{

        const [
            x,
            y
        ] =
            positions.get(node);


        const frequencyValue =
            topFrequency.get(node);


        const group =
            nodeCluster.get(node);


        let degree=0;


        visibleEdges.forEach(edge=>{

            if(
                edge.a===node ||
                edge.b===node
            ){

                degree++;

            }

        });


        nodeX.push(x);

        nodeY.push(y);


        nodeSize.push(

            18 +
            Math.sqrt(
                frequencyValue
            )*3.5

        );


        nodeColor.push(

            FLOWER_COLORS[
                group %
                FLOWER_COLORS.length
            ]

        );


        nodeText.push(node);


        nodeHover.push(

            `<b>🌼 ${escapeHTML(node)}</b>
             <br><br>
             📚 Papers:
             <b>${frequencyValue.toLocaleString()}</b>
             <br>
             🔗 Connections:
             <b>${degree}</b>
             <br>
             🌸 Flower Group:
             <b>${group+1}</b>`

        );

    });


    /* FLOWER CORE */

    const flowerCore={

        x:nodeX,

        y:nodeY,

        mode:"markers",

        marker:{

            symbol:"circle",

            size:
                nodeSize.map(
                    s =>
                        Math.max(
                            3,
                            s*.18
                        )
                ),

            color:"#FFF3A6"

        },

        hoverinfo:"none",

        showlegend:false

    };


    /* NODE TRACE */

    const nodeTrace={

        x:nodeX,

        y:nodeY,

        mode:"markers+text",

        text:nodeText,

        textposition:
            "middle center",

        textfont:{

            family:"Arial",

            size:8,

            color:"#24382A"

        },

        hovertext:nodeHover,

        hoverinfo:"text",

        marker:{

            symbol:"circle",

            size:nodeSize,

            color:nodeColor,

            opacity:.94,

            line:{

                width:2,

                color:"white"

            }

        },

        showlegend:false

    };


    /* =====================================================
       BACKGROUND GRASS
    ===================================================== */

    const randomGrass =
        seededRandom(100);


    const grassX=[];

    const grassY=[];


    for(
        let i=0;
        i<1000;
        i++
    ){

        grassX.push(
            -10+
            randomGrass()*20
        );


        grassY.push(
            -7.5+
            randomGrass()*15
        );

    }


    const grassTrace={

        x:grassX,

        y:grassY,

        mode:"markers",

        marker:{

            size:2,

            color:
                "rgba(65,110,55,.18)"

        },

        hoverinfo:"none",

        showlegend:false

    };


    /* =====================================================
       BACKGROUND FLOWERS
    ===================================================== */

    const randomFlower =
        seededRandom(200);


    const flowerSymbols=[
        "🌼",
        "🌸",
        "🌻",
        "🌷"
    ];


    const flowerX=[];

    const flowerY=[];

    const flowerText=[];


    for(
        let i=0;
        i<140;
        i++
    ){

        flowerX.push(
            -9.5+
            randomFlower()*19
        );


        flowerY.push(
            -7+
            randomFlower()*14
        );


        flowerText.push(

            flowerSymbols[
                Math.floor(
                    randomFlower() *
                    flowerSymbols.length
                )
            ]

        );

    }


    const flowersTrace={

        x:flowerX,

        y:flowerY,

        mode:"text",

        text:flowerText,

        textfont:{

            size:12

        },

        hoverinfo:"none",

        showlegend:false

    };


    /* =====================================================
       BUTTERFLIES
    ===================================================== */

    const butterflies=[

        [-8,5.8],

        [7.5,5.5],

        [8,-5],

        [-7.5,-5],

        [3,6.5],

        [-3.5,6.4]

    ];


    const butterflyTrace={

        x:
            butterflies.map(
                p=>p[0]
            ),

        y:
            butterflies.map(
                p=>p[1]
            ),

        mode:"text",

        text:
            butterflies.map(
                ()=>"🦋"
            ),

        textfont:{

            size:20

        },

        hoverinfo:"none",

        showlegend:false

    };


    /* =====================================================
       CLOUDS
    ===================================================== */

    const cloudTrace={

        x:[
            -7,
            6.5,
            0
        ],

        y:[
            6.8,
            6.8,
            7.5
        ],

        mode:"text",

        text:[
            "☁️",
            "☁️",
            "☁️"
        ],

        textfont:{

            size:30

        },

        hoverinfo:"none",

        showlegend:false

    };


    /* =====================================================
       GROUP LABELS
    ===================================================== */

    const labelX=[];

    const labelY=[];

    const labelText=[];


    communities.forEach(
        (community,groupID)=>{

            const groupNodes =
                community.filter(
                    node =>
                        selectedSet.has(node)
                );


            if(groupNodes.length===0){

                return;

            }


            const [
                cx,
                cy
            ] =
                centers[groupID];


            const top3 =
                [...groupNodes]

                .sort(
                    (a,b)=>
                        topFrequency.get(b)
                        -
                        topFrequency.get(a)
                )

                .slice(0,3);


            labelX.push(cx);

            labelY.push(cy+1.65);


            labelText.push(

                `<b>FLOWER GROUP ${groupID+1}</b>
                 <br>
                 ${top3
                    .map(
                        escapeHTML
                    )
                    .join(" • ")}`

            );

        }
    );


    const labelTrace={

        x:labelX,

        y:labelY,

        mode:"text",

        text:labelText,

        textfont:{

            family:"Arial",

            size:11,

            color:"#38533A"

        },

        hoverinfo:"none",

        showlegend:false

    };


    /* =====================================================
       LEGEND
    ===================================================== */

    const legendTraces=[];


    communities.forEach(
        (community,groupID)=>{

            const groupNodes =
                community.filter(
                    node =>
                        selectedSet.has(node)
                );


            if(
                groupNodes.length===0
            ){

                return;

            }


            legendTraces.push({

                x:[null],

                y:[null],

                mode:"markers",

                marker:{

                    size:14,

                    color:
                        FLOWER_COLORS[
                            groupID %
                            FLOWER_COLORS.length
                        ],

                    line:{

                        color:"white",

                        width:1

                    }

                },

                name:
                    `🌸 Flower Group ${groupID+1}`,

                hoverinfo:"name"

            });

        }
    );


    /* =====================================================
       HILLS
    ===================================================== */

    const hillX=[

        -10,-8.5,-7,-5.5,-4,
        -2.5,-1,.5,2,3.5,
        5,6.5,8,10

    ];


    const hillY=[

        4.3,5.8,4.5,6,
        4.4,5.7,4.3,5.9,
        4.4,5.8,4.5,5.9,
        4.4,5.2

    ];


    const hillTrace={

        x:hillX,

        y:hillY,

        mode:"lines",

        fill:"tozeroy",

        line:{

            color:"#78966E",

            width:1

        },

        fillcolor:
            "rgba(120,150,110,.18)",

        hoverinfo:"none",

        showlegend:false

    };


    /* =====================================================
       DASHBOARD
    ===================================================== */

    const dashboard=

        `<b>🌱 RESEARCH FLOWER FIELD</b>
        <br><br>
        📚 Articles:
        <b>${rows.length.toLocaleString()}</b>
        <br>
        🔑 Keywords:
        <b>${frequency.size.toLocaleString()}</b>
        <br>
        🌼 Showing:
        <b>${nodes.length}</b>
        <br>
        🌸 Flower Groups:
        <b>${communities.length}</b>
        <br>
        🌿 Connections:
        <b>${visibleEdges.length}</b>
        <br><br>
        <b>HOW TO READ</b>
        <br>
        🌼 Larger circle = more papers
        <br>
        🌿 Dark line = stronger connection
        <br>
        🌸 Same group = related keywords`;


    /* =====================================================
       PLOT
    ===================================================== */

    const data=[

        hillTrace,

        cloudTrace,

        grassTrace,

        flowersTrace,

        crossTrace,

        internalTrace,

        flowerCore,

        nodeTrace,

        butterflyTrace,

        labelTrace,

        ...legendTraces

    ];


    const layout={

        title:{

            text:
                "🌱🌼 <b>AI RESEARCH FLOWER FIELD</b>"
                +
                "<br><sup>"
                +
                "Research Keywords Growing Together"
                +
                "</sup>",

            x:.5,

            xanchor:"center",

            y:.97,

            font:{

                family:"Arial",

                size:28,

                color:"#24382A"

            }

        },


        paper_bgcolor:"#DDEBCF",

        plot_bgcolor:"#CFE3B7",


        margin:{

            l:40,

            r:260,

            t:130,

            b:40

        },


        xaxis:{

            range:[
                -10,
                10
            ],

            showgrid:false,

            zeroline:false,

            showticklabels:false

        },


        yaxis:{

            range:[
                -8,
                8
            ],

            showgrid:false,

            zeroline:false,

            showticklabels:false

        },


        legend:{

            title:{

                text:
                    "<b>🌸 FLOWER GROUPS</b>"

            },

            bgcolor:
                "rgba(247,244,232,.90)",

            bordercolor:
                "rgba(60,90,55,.25)",

            borderwidth:1,

            x:1.01,

            y:.94

        },


        hovermode:
            "closest",


        hoverlabel:{

            bgcolor:"#F7F4E8",

            bordercolor:"#78966E",

            font:{

                color:"#26382A",

                size:13

            }

        },


        annotations:[{

            x:.015,

            y:.025,

            xref:"paper",

            yref:"paper",

            text:dashboard,

            showarrow:false,

            align:"left",

            bgcolor:
                "rgba(247,244,232,.94)",

            bordercolor:"#78966E",

            borderwidth:1,

            borderpad:13,

            font:{

                family:"Arial",

                color:"#26382A",

                size:11

            }

        }]

    };


    Plotly.newPlot(

        "plot",

        data,

        layout,

        {

            responsive:true,

            displaylogo:false

        }

    );


    document.getElementById(
        "status"
    ).innerHTML=

        `✅ สำเร็จ |
        Articles: <b>${rows.length.toLocaleString()}</b>
        |
        Keywords: <b>${frequency.size.toLocaleString()}</b>
        |
        Showing: <b>${nodes.length}</b>
        |
        Flower Groups: <b>${communities.length}</b>
        |
        Edges: <b>${visibleEdges.length}</b>`;

}


/* =========================================================
   EXPORT PNG
========================================================= */

function exportPNG(){

    Plotly.downloadImage(

        "plot",

        {

            format:"png",

            filename:
                "AI_Research_Flower_Field",

            width:2400,

            height:1700,

            scale:2

        }

    );

}

window.addEventListener(
    "load",
    ()=>{
        if(
            CSV_DATA !==
            "PASTE_YOUR_CSV_HERE"
        ){

            generateVisualization();

        }
        else{

            document.getElementById(
                "status"
            ).innerHTML=

                "📊 ใส่ข้อมูล CSV ในตัวแปร CSV_DATA แล้วกด Generate";

        }
    }
);

</script>
